<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烟花 · 不断绽放</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23050812'/><g stroke-width='2'><path d='M16 16 L16 3' stroke='%23ff6b8a'/><path d='M16 16 L16 29' stroke='%2368f0ff'/><path d='M16 16 L3 16' stroke='%23ffd166'/><path d='M16 16 L29 16' stroke='%23a78bfa'/><path d='M16 16 L7 7' stroke='%234ee38a'/><path d='M16 16 L25 7' stroke='%23ff9f43'/><path d='M16 16 L7 25' stroke='%234fd1ff'/><path d='M16 16 L25 25' stroke='%23ff5ea8'/></g></svg>">
<style>
  :root{
    --ink:#04070c;
    --ice:#dff2ff;
    --ice-dim:rgba(203,230,248,.40);
    --hair:rgba(178,214,238,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink);
    color:var(--ice);
    overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:fixed;inset:0;
    width:100%;height:100%;
    display:block;
    touch-action:manipulation;
  }
  .fallback{
    position:fixed;inset:0;
    display:none;
    background:#04070c;
  }
  .fallback{
    background:
      radial-gradient(46% 40% at 50% 66%, rgba(190,120,255,.22), rgba(4,7,12,0) 74%),
      radial-gradient(30% 24% at 50% 34%, rgba(255,150,190,.14), rgba(4,7,12,0) 72%),
      #05080f;
  }

  .title{
    position:fixed;
    top:clamp(22px,5vh,54px);
    right:clamp(20px,3.2vw,46px);
    display:flex;align-items:flex-start;
    gap:12px;
    pointer-events:none;
    user-select:none;
  }
  .title .rule{
    width:1px;
    height:clamp(34px,7vh,64px);
    background:linear-gradient(to bottom,var(--hair),rgba(178,214,238,0));
    margin-top:2px;
  }
  .title .word{
    writing-mode:vertical-rl;
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
    font-size:clamp(15px,1.5vw,21px);
    letter-spacing:.42em;
    color:rgba(214,238,252,.48);
    line-height:1.1;
  }

  .bar{
    position:fixed;
    left:0;right:0;bottom:0;
    /* 底部留出平台水印的高度，避免控件被角标压住 */
    padding:0 clamp(18px,3vw,40px) clamp(50px,7vh,66px);
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;
    pointer-events:none;
    background:linear-gradient(to top,rgba(3,5,12,.82),rgba(3,5,12,.40) 52%,rgba(3,5,12,0));
    padding-top:48px;
  }
  .bar .note{
    margin:0;
    font-size:13px;line-height:1.9;
    letter-spacing:.06em;
    color:rgba(232,240,252,.94);
    max-width:min(40ch,52vw);
    text-shadow:0 1px 10px rgba(4,7,14,.9),0 0 3px rgba(4,7,14,.95);
  }
  .bar .acts{
    display:flex;gap:10px;
    pointer-events:auto;
    flex:0 0 auto;
  }
  button{
    -webkit-appearance:none;appearance:none;
    font:inherit;font-size:13px;
    letter-spacing:.08em;
    color:rgba(214,238,252,.62);
    background:rgba(12,22,32,.34);
    border:1px solid var(--hair);
    border-radius:2px;
    min-height:44px;
    padding:11px 16px;
    cursor:pointer;
    transition:color .25s ease,border-color .25s ease,background-color .25s ease;
  }
  button:hover{color:rgba(232,247,255,.92);border-color:rgba(178,214,238,.34);background:rgba(16,30,44,.5)}
  button:active{color:#fff;border-color:rgba(196,228,248,.5)}
  button:focus-visible{outline:2px solid rgba(143,226,255,.85);outline-offset:2px}
  button[disabled]{opacity:.4;cursor:default}

  /* ===== 开屏授权界面 ===== */
  .boot{
    position:fixed;inset:0;z-index:70;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    overflow:hidden;
    color:#17171a;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    background-color:#eceae5;
    background-image:
      radial-gradient(118% 96% at 50% 40%, #f7f6f2 0%, #eeede8 52%, #e6e5e0 100%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.014) 0 1px, rgba(0,0,0,0) 1px 33.333%);
    transition:opacity .45s ease;
  }
  .boot.is-out{opacity:0;pointer-events:none}
  .boot-scan{
    position:absolute;left:0;right:0;top:-30%;height:160%;
    pointer-events:none;opacity:0;
    background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.94) 42%,rgba(23,23,26,.10) 56%,rgba(255,255,255,0));
  }
  .boot.is-granted .boot-scan{animation:bootScan .46s ease both}
  .boot.is-granted .boot-grant,
  .boot.is-granted .boot-hint{animation:none;opacity:0;transition:opacity .18s ease}
  @keyframes bootScan{
    0%{opacity:.85;transform:translateY(-52%)}
    100%{opacity:0;transform:translateY(52%)}
  }

  .boot-hud{
    position:absolute;left:clamp(16px,3vw,34px);right:clamp(16px,3vw,34px);top:clamp(16px,3vh,28px);
  }
  .boot-hud-row{
    display:flex;align-items:baseline;gap:12px;
    font-size:10.5px;letter-spacing:.17em;color:#33332f;
    animation:bootIn .5s ease .1s both;
  }
  .boot-clock{color:#bd6224;letter-spacing:.12em}
  .boot-bar{
    position:relative;width:158px;height:2px;margin-top:10px;
    background:rgba(23,23,26,.14);
    animation:bootIn .5s ease .16s both;
  }
  .boot-bar i{
    position:absolute;left:0;top:0;height:100%;width:0;
    background:#bd6224;
    transition:width 1.1s cubic-bezier(.2,.8,.3,1);
  }
  .boot-dots{
    display:flex;gap:5px;margin-top:9px;
    animation:bootIn .5s ease .22s both;
  }
  .boot-dots span{width:3px;height:3px;background:rgba(23,23,26,.30)}

  .boot-mid{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
    max-width:min(860px,92vw);
  }
  .boot-title{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-weight:700;
    font-size:clamp(27px,4.9vw,46px);
    letter-spacing:.30em;
    text-indent:.30em;
    line-height:1.2;
    color:#141416;
    animation:bootIn 1s cubic-bezier(.2,1,.3,1) .55s both;
  }
  .boot-sub{
    margin:clamp(10px,1.6vh,16px) 0 0;
    font-size:clamp(9.5px,1vw,11.5px);
    letter-spacing:.44em;
    text-indent:.44em;
    color:#71716b;
    animation:bootIn .8s ease .85s both;
  }
  .boot-rule{
    width:min(780px,88vw);height:1px;margin:clamp(12px,2vh,20px) 0 0;
    background:linear-gradient(90deg,rgba(23,23,26,0),rgba(23,23,26,.42) 16%,rgba(23,23,26,.42) 84%,rgba(23,23,26,0));
    animation:bootRule .9s cubic-bezier(.2,1,.3,1) .95s both;
  }
  @keyframes bootRule{
    0%{transform:scaleX(.04);opacity:.25}
    100%{transform:scaleX(1);opacity:1}
  }
  .boot-grant{
    margin-top:clamp(26px,4.2vh,40px);
    display:inline-flex;align-items:center;gap:14px;
    padding:9px 16px;
    font:inherit;font-size:clamp(13px,1.2vw,15px);
    color:#17171a;
    background:transparent;
    border:1px solid rgba(23,23,26,.52);
    border-radius:0;
    cursor:pointer;
    letter-spacing:.06em;
    transition:background .18s ease,color .18s ease,border-color .18s ease;
    animation:bootIn .6s ease 1.2s both;
  }
  .boot-grant em{
    font-style:normal;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-weight:600;letter-spacing:.16em;
  }
  .boot-grant span{
    font-size:.72em;letter-spacing:.30em;opacity:.55;
  }
  .boot-grant:hover{background:#17171a;color:#f1f0eb;border-color:#17171a}
  .boot-grant:hover span{opacity:.7}
  .boot-grant:focus-visible{outline:2px solid #17171a;outline-offset:3px}
  .boot-hint{
    margin:clamp(12px,1.8vh,18px) 0 0;
    font-size:clamp(10px,1.1vw,12px);
    letter-spacing:.10em;
    color:#72726c;
    animation:bootIn .6s ease 1.45s both;
  }
  .boot-hint kbd{
    font:inherit;font-size:.94em;
    padding:1px 5px;margin:0 2px;
    border:1px solid rgba(23,23,26,.26);
    border-radius:2px;
  }

  .boot-foot{
    position:absolute;left:clamp(16px,3vw,34px);right:clamp(16px,3vw,34px);bottom:clamp(16px,3vh,28px);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:14px;
    font-size:10.5px;letter-spacing:.15em;color:#6d6d67;
    animation:bootIn .6s ease 1.6s both;
  }
  .boot-step{justify-self:start}
  .boot-step b{color:#1c1c1e;font-weight:600}
  .boot-wait{
    justify-self:center;text-align:center;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-size:clamp(11px,1.3vw,13.5px);
    letter-spacing:.08em;color:#2a2a2c;
  }
  .boot-wait em{
    display:block;margin-top:5px;
    font-style:normal;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    font-size:9px;letter-spacing:.28em;color:#7c7c76;
  }
  .boot-id{justify-self:end;text-align:right}
  .boot-id em{
    display:block;margin-top:5px;font-style:normal;font-size:9px;letter-spacing:.22em;color:#8a8a84;
  }

  @keyframes bootIn{
    0%{opacity:0;transform:translateY(6px)}
    100%{opacity:1;transform:none}
  }
  @media (prefers-reduced-motion: reduce){
    .boot{display:none}
  }

  /* ===== 访问密码 · 终端面板 ===== */
  .lock{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;
    padding:26px;
    background:
      radial-gradient(118% 84% at 50% 42%, rgba(9,18,30,.72), rgba(3,6,10,.975) 64%),
      #04070c;
    transition:opacity .5s ease;
  }
  .lock::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(143,226,255,.045) 1px, rgba(143,226,255,0) 1px),
      linear-gradient(90deg, rgba(143,226,255,.045) 1px, rgba(143,226,255,0) 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(72% 62% at 50% 44%, #000 32%, transparent 78%);
    mask-image:radial-gradient(72% 62% at 50% 44%, #000 32%, transparent 78%);
  }
  .lock.is-open{opacity:0;pointer-events:none}

  .lock-inner{
    position:relative;z-index:1;
    width:min(392px,88vw);
    display:flex;flex-direction:column;gap:11px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
    opacity:0;transform:translateY(8px);
    transition:opacity .6s ease, transform .6s cubic-bezier(.22,1,.36,1);
  }

  .lock-bar{
    display:flex;justify-content:space-between;align-items:center;
    font-size:9.5px;letter-spacing:.22em;
    color:rgba(143,226,255,.48);
  }
  .lock-state{display:inline-flex;align-items:center;gap:8px}
  .lock-dot{
    width:5px;height:5px;border-radius:50%;
    background:#8fe2ff;
    box-shadow:0 0 9px rgba(143,226,255,.85);
    animation:lockPulse 2.6s ease-in-out infinite;
  }
  @keyframes lockPulse{
    0%,100%{opacity:.30}
    50%{opacity:1}
  }

  .lock-frame{
    position:relative;
    padding:22px 20px 15px;
    border:1px solid rgba(143,226,255,.20);
    background:linear-gradient(180deg, rgba(12,24,38,.60), rgba(6,12,20,.32));
    box-shadow:inset 0 1px 0 rgba(143,226,255,.10);
    overflow:hidden;
  }
  @keyframes lockScan{
    0%{left:-64px}
    100%{left:100%}
  }
  .tick{
    position:absolute;width:13px;height:13px;
    border:1px solid rgba(143,226,255,.62);
    box-shadow:0 0 8px rgba(143,226,255,.16);
  }
  .tick.tl{left:0;top:0;border-right:0;border-bottom:0}
  .tick.tr{right:0;top:0;border-left:0;border-bottom:0}
  .tick.bl{left:0;bottom:0;border-right:0;border-top:0}
  .tick.br{right:0;bottom:0;border-left:0;border-top:0}

  .lock-label{
    margin:0 0 15px;
    font-size:11px;letter-spacing:.26em;
    color:rgba(203,230,248,.58);
  }
  .lock-label em{
    display:block;margin-top:7px;
    font-style:normal;font-size:9px;letter-spacing:.36em;
    color:rgba(143,226,255,.40);
  }

  .lock-field{display:flex;gap:9px;align-items:stretch}
  .lock-input{
    position:relative;flex:1 1 auto;min-width:0;
    display:flex;align-items:stretch;
    overflow:hidden;
  }
  .lock-input::after{
    content:"";position:absolute;top:0;bottom:0;left:-64px;width:64px;
    background:linear-gradient(90deg, rgba(143,226,255,0), rgba(143,226,255,.16), rgba(143,226,255,0));
    animation:lockScan 3.6s linear infinite;
    pointer-events:none;
  }
  .lock-input::before{
    content:"\203A";
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:15px;line-height:1;
    color:rgba(143,226,255,.48);
    pointer-events:none;
  }
  .lock-field input{
    flex:1 1 auto;min-width:0;
    font-family:inherit;
    font-size:17px;
    letter-spacing:.40em;
    color:#e4f6ff;
    background:rgba(143,226,255,.05);
    border:1px solid rgba(143,226,255,.26);
    border-radius:0;
    padding:12px 14px 12px 34px;
    caret-color:#8fe2ff;
    -webkit-appearance:none;appearance:none;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .lock-field input::placeholder{
    font-size:11px;letter-spacing:.30em;
    color:rgba(143,226,255,.28);
  }
  .lock-field input:focus{
    outline:none;
    border-color:rgba(143,226,255,.60);
    background:rgba(143,226,255,.10);
    box-shadow:inset 0 0 0 1px rgba(143,226,255,.16), 0 0 20px rgba(90,180,255,.18);
  }
  .lock-field button{
    flex:0 0 auto;
    min-height:47px;
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:0 15px;
    font-family:inherit;font-size:13px;letter-spacing:.16em;
    color:#bfe6ff;
    background:transparent;
    border:1px solid rgba(143,226,255,.34);
    border-radius:0;cursor:pointer;
    transition:background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .lock-field button em{font-style:normal;font-size:9px;letter-spacing:.22em;opacity:.5}
  .lock-field button:hover{
    background:rgba(143,226,255,.12);
    border-color:rgba(143,226,255,.72);
    color:#eaf9ff;
    box-shadow:0 0 18px rgba(90,180,255,.22);
  }
  .lock-field button:focus-visible{outline:1px solid rgba(143,226,255,.85);outline-offset:2px}

  .lock-tip{
    min-height:1.1em;margin:13px 0 0;
    font-size:10.5px;letter-spacing:.16em;line-height:1.6;
    color:rgba(255,178,120,.86);
  }

  .lock-meta{
    display:flex;justify-content:space-between;
    font-size:9px;letter-spacing:.20em;
    color:rgba(143,226,255,.30);
  }

  @keyframes lockShake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    40%{transform:translateX(4px)}
    60%{transform:translateX(-3px)}
    80%{transform:translateX(2px)}
  }
  .lock.shake .lock-inner{animation:lockShake .34s ease}
  @media (prefers-reduced-motion: reduce){
    .lock.shake .lock-inner{animation:none}
  }

  @media (max-width:520px){
    .bar{flex-direction:column;align-items:stretch;gap:14px}
    .bar .note{max-width:100%;font-size:12.5px}
    .acts{justify-content:flex-start}
    .lock-inner{width:min(392px,90vw)}
    .lock-frame{padding:18px 14px 13px}
    .lock-label{letter-spacing:.20em}
    .lock-field{flex-direction:column;gap:10px}
    .lock-input{min-height:47px}
    .lock-field button{width:100%}
    .lock-field input{letter-spacing:.32em}
    .boot-title{letter-spacing:.20em;text-indent:.20em}
    .boot-sub{letter-spacing:.30em;text-indent:.30em}
    .boot-foot{grid-template-columns:1fr;justify-items:center;gap:7px;font-size:9.5px;letter-spacing:.10em}
    .boot-step,.boot-id{justify-self:center;text-align:center}
    .boot-id{display:none}
  }
</style>
</head>

      <div class="lock-bar">
        <span class="lock-state"><i class="lock-dot"></i>SECURE CHANNEL</span>
        <span>02 / 02</span>
      </div>

      <div class="lock-frame">
        <span class="tick tl"></span><span class="tick tr"></span>
        <span class="tick bl"></span><span class="tick br"></span>

        <p class="lock-label">输入访问密码<em>ACCESS CODE REQUIRED</em></p>

        <form class="lock-field" id="pwForm" autocomplete="off">
          <span class="lock-input">
            <input id="pw" type="password" name="pw" inputmode="numeric" autocomplete="off" aria-label="访问密码" placeholder="ACCESS CODE">
          </span>
          <button type="submit" id="pwGo"><span>进入</span><em>ENTER</em></button>
        </form>

        <p class="lock-tip" id="pwTip" role="status" aria-live="polite"></p>
      </div>

      <div class="lock-meta">
        <span>ID 0x1F4A</span>
        <span>AUTH · LOCKED</span>
      </div>
    </div>
  </div>

<script>
(function () {
  var canvas = document.getElementById('stage');
  var fallback = document.getElementById('fallback');
  var btnAgain = document.getElementById('again');
  var btnToggle = document.getElementById('toggle');

  // 访问密码
  var lock = document.getElementById('lock');
  var lockInner = document.getElementById('lockInner');
  var pwForm = document.getElementById('pwForm');
  var pwInput = document.getElementById('pw');
  var pwTip = document.getElementById('pwTip');
  var PASS = '123';
  var unlocked = false;

  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  var ctx = null;
  try { ctx = canvas.getContext('2d', { alpha: false }); } catch (err) { ctx = null; }

  var W = 0, H = 0;
  var stars = [];
  var rockets = [];
  var parts = [];
  var flashes = [];
  var pending = [];
  var paused = false;
  var raf = 0, lastT = 0, clock = 0;
  var nextSingle = 0.4, nextSalvo = 4.5, nextFinale = 14.0;
  var MAX_PARTS = 3600;

  var castleEl = null;
  var castleBmp = null;
  var spriteCache = {};

  // 参考图配色：暖金、朱红、洋红、冰蓝、紫
  var PALETTE = [46, 44, 40, 34, 24, 14, 8, 2, 352, 342, 332, 316, 268];

  function pickHue() {
    return PALETTE[Math.floor(Math.random() * PALETTE.length)];
  }

  function nearHue(h, d) {
    return (h + (Math.random() - 0.5) * d + 720) % 360;
  }

  function sprite(hue) {
    var k = Math.round(hue / 10) % 36;
    if (spriteCache[k]) return spriteCache[k];
    var c = document.createElement('canvas');
    c.width = 48; c.height = 48;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(24, 24, 0, 24, 24, 24);
    var h = k * 10;
    rg.addColorStop(0, 'rgba(255,255,255,.72)');
    rg.addColorStop(0.22, 'hsla(' + h + ',100%,82%,.62)');
    rg.addColorStop(0.52, 'hsla(' + h + ',100%,66%,.30)');
    rg.addColorStop(1, 'hsla(' + h + ',100%,58%,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 48, 48);
    spriteCache[k] = c;
    return c;
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    var pw = Math.round(W * dpr);
    var ph = Math.round(H * dpr);
    var maxPx = 2600000;
    if (pw * ph > maxPx) {
      var s = Math.sqrt(maxPx / (pw * ph));
      pw = Math.max(1, Math.round(pw * s));
      ph = Math.max(1, Math.round(ph * s));
    }
    canvas.width = pw;
    canvas.height = ph;
    ctx.setTransform(pw / W, 0, 0, ph / H, 0, 0);
    buildStars();
    paintSky();
  }

  function buildStars() {
    stars = [];
    var n = Math.min(240, Math.round((W * H) / 22000));
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.66,
        r: 0.4 + Math.random() * 1.1,
        a: 0.10 + Math.random() * 0.42,
        p: Math.random() * 6.2832
      });
    }
  }

  function paintSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#010206');
    g.addColorStop(0.45, '#02040c');
    g.addColorStop(0.72, '#04060f');
    g.addColorStop(1, '#070a16');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars() {
    ctx.globalCompositeOperation = 'source-over';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.70 + 0.30 * Math.sin(clock * 0.9 + s.p);
      ctx.fillStyle = 'rgba(190,214,255,' + (s.a * tw * 0.40).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
  }

  // 把城堡图的黑底吃掉：以亮度作为 alpha，边缘自然过渡
  function bakeCastle() {
    if (!castleEl || !castleEl.complete || !castleEl.naturalWidth) return;
    var w = 1000;
    var h = Math.round(w * castleEl.naturalHeight / castleEl.naturalWidth);
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var g = c.getContext('2d');
    g.drawImage(castleEl, 0, 0, w, h);
    var id = g.getImageData(0, 0, w, h);
    var d = id.data;
    for (var i = 0; i < d.length; i += 4) {
      var lum = (d[i] * 0.62 + d[i + 1] * 0.28 + d[i + 2] * 0.10);
      var a = lum < 26 ? 0 : Math.min(255, (lum - 26) * 2.1);
      d[i + 3] = a;
      d[i] = Math.min(255, d[i] * 1.06);
      d[i + 1] = Math.min(255, d[i + 1] * 1.04);
    }
    g.putImageData(id, 0, 0);
    castleBmp = c;
  }

  function castleRect() {
    if (!castleBmp) return null;
    var ratio = castleBmp.height / castleBmp.width;
    var w = Math.min(W * 0.96, 940);
    var h = w * ratio;
    var maxH = H * 0.70;
    if (h > maxH) { h = maxH; w = h / ratio; }
    return { x: W / 2 - w / 2, y: H - h + 2, w: w, h: h };
  }

  function drawCastle() {
    var r = castleRect();
    if (!r) return;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(castleBmp, r.x, r.y, r.w, r.h);

    // 城堡前的暖光地面与反射
    ctx.globalCompositeOperation = 'lighter';
    var gx = W / 2, gy = r.y + r.h * 0.82;
    var rad = Math.max(W * 0.36, r.w * 0.66);
    var rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, rad);
    rg.addColorStop(0, 'rgba(255,130,190,0.13)');
    rg.addColorStop(0.45, 'rgba(150,95,235,0.06)');
    rg.addColorStop(1, 'rgba(90,120,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(gx, gy, rad, 0, 6.2832);
    ctx.fill();
  }

  function pushP(o) {
    parts.push(o);
    if (parts.length > MAX_PARTS) parts.splice(0, parts.length - MAX_PARTS);
  }

  function P(x, y, vx, vy, h, life, size, w, trail, g, drag, extra) {
    var o = {
      x: x, y: y, px: x, py: y, vx: vx, vy: vy,
      h: h, life: life, l0: life, size: size, w: w,
      trail: trail, g: g, drag: drag, strobe: 0, split: 0
    };
    if (extra) for (var k in extra) o[k] = extra[k];
    return o;
  }

  function flash(x, y, r, life) {
    flashes.push({ x: x, y: y, r: r, life: life, l0: life });
  }

  // ---------- 弹型 ----------
  function shell(type, x, y, hue, scale) {
    scale = scale || 1;
    var base = Math.min(W, H) * 0.315 * scale;
    var i, n, ang, v, h;

    if (type === 'peony' || type === 'chrys' || type === 'double') {
      var two = (type === 'double');
      n = type === 'chrys' ? 280 : 340;
      for (i = 0; i < n; i++) {
        ang = Math.random() * 6.2832;
        v = base * (0.52 + Math.random() * 0.62);
        h = two ? (Math.random() < 0.55 ? hue : nearHue(hue + 300, 20)) : nearHue(hue, 14);
        pushP(P(x, y, Math.cos(ang) * v, Math.sin(ang) * v,
          h, (type === 'chrys' ? 2.9 : 2.2) + Math.random() * 1.2,
          (type === 'chrys' ? 2.6 : 3.1) + Math.random() * 2.1,
          1.15 + Math.random() * 0.85,
          true, type === 'chrys' ? 58 : 46, type === 'chrys' ? 0.78 : 1.30));
      }
      if (two) {
        for (i = 0; i < 130; i++) {
          ang = Math.random() * 6.2832;
          v = base * 0.48 * (0.30 + Math.random() * 0.70);
          h = nearHue(pickHue(), 10);
          pushP(P(x, y, Math.cos(ang) * v, Math.sin(ang) * v, h,
            1.6 + Math.random() * 0.8, 2.4 + Math.random() * 1.6,
            1.0, true, 54, 1.45));
        }
      }
    } else if (type === 'ring') {
      n = Math.round(180 * scale);
      for (i = 0; i < n; i++) {
        ang = (i / n) * 6.2832;
        v = base * 0.94;
        h = nearHue(hue, 16);
        pushP(P(x, y, Math.cos(ang) * v, Math.sin(ang) * v * 0.36, h,
          2.1 + Math.random() * 0.9, 2.4 + Math.random() * 1.8, 1.15, true, 52, 1.35));
      }
    } else if (type === 'willow') {
      n = Math.round(130 * scale);
      for (i = 0; i < n; i++) {
        ang = Math.random() * 6.2832;
        v = base * (0.40 + Math.random() * 0.46);
        h = 40 + Math.random() * 10;
        pushP(P(x, y, Math.cos(ang) * v, Math.sin(ang) * v, h,
          3.4 + Math.random() * 1.4, 2.2 + Math.random() * 1.6,
          1.05, true, 92, 0.55));
      }
    } else if (type === 'palm') {
      n = 22;
      for (i = 0; i < n; i++) {
        ang = (i / n) * 6.2832 + Math.random() * 0.18;
        v = base * (1.02 + Math.random() * 0.22);
        h = nearHue(hue, 12);
        pushP(P(x, y, Math.cos(ang) * v, Math.sin(ang) * v, h,
          2.6 + Math.random() * 0.7, 5.4 + Math.random() * 2.6, 1.9, true, 70, 0.62));
      }
    } else if (type === 'crossette') {
      n = 52;
      for (i = 0; i < n; i++) {
        ang = Math.random() * 6.2832;
        v = base * (0.52 + Math.random() * 0.36);
        h = nearHue(hue, 12);
        pushP(P(x, y, Math.cos(ang) * v, Math.sin(ang) * v, h,
          1.4 + Math.random() * 0.3, 5.0 + Math.random() * 3.0, 1.8, true, 52, 1.05,
          { split: 0.55 + Math.random() * 0.22 }));
      }
    } else if (type === 'strobe') {
      n = Math.round(140 * scale);
      for (i = 0; i < n; i++) {
        ang = Math.random() * 6.2832;
        v = base * (0.28 + Math.random() * 0.55);
        h = 46 + (Math.random() - 0.5) * 18;
        pushP(P(x, y, Math.cos(ang) * v, Math.sin(ang) * v, h,
          2.4 + Math.random() * 1.2, 2.6 + Math.random() * 2.0, 1.15, false, 46, 1.6,
          { strobe: 1, ph: Math.random() * 6.2832 }));
      }
    }

    flash(x, y, base * 1.15, 0.42);
  }

  // ---------- 发射 ----------
  function pickType() {
    var r = Math.random();
    if (r < 0.28) return 'chrys';
    if (r < 0.48) return 'peony';
    if (r < 0.64) return 'double';
    if (r < 0.76) return 'willow';
    if (r < 0.86) return 'crossette';
    if (r < 0.93) return 'palm';
    return 'strobe';
  }

  function launch(x, y, type, scale, hue) {
    var x0 = (x == null) ? W * (0.10 + Math.random() * 0.80) : Math.max(18, Math.min(W - 18, x));
    var yT = (y == null) ? H * (0.11 + Math.random() * 0.34) : Math.max(H * 0.09, Math.min(H * 0.60, y));
    var riseT = 0.85 + Math.random() * 0.45;
    rockets.push({
      x: x0, y: H + 10,
      vx: (Math.random() - 0.5) * 16,
      vy: -(H + 10 - yT) / riseT,
      ty: yT, life: riseT + 0.25,
      type: type || pickType(),
      scale: scale || 1,
      hue: (hue == null) ? pickHue() : hue
    });
  }

  // ---------- 编排 ----------
  function plan(dt) {
    for (var i = pending.length - 1; i >= 0; i--) {
      var q = pending[i];
      q.t -= dt;
      if (q.t <= 0) {
        launch(q.x, q.y, q.type, q.scale, q.hue);
        pending.splice(i, 1);
      }
    }

    nextSingle -= dt;
    if (nextSingle <= 0) {
      launch();
      nextSingle = 0.36 + Math.random() * 0.5;
    }

    nextSalvo -= dt;
    if (nextSalvo <= 0) {
      var baseHue = pickHue();
      for (var k = 0; k < 4; k++) {
        pending.push({
          t: k * 0.24,
          x: W * (0.16 + Math.random() * 0.70),
          y: H * (0.12 + Math.random() * 0.30),
          type: pickType(), scale: 1.0, hue: nearHue(baseHue + k * 50, 20)
        });
      }
      nextSalvo = 4.5 + Math.random() * 3.5;
    }

    nextFinale -= dt;
    if (nextFinale <= 0) {
      var hue0 = pickHue();
      for (var j = 0; j < 12; j++) {
        pending.push({
          t: j * 0.16 + Math.random() * 0.12,
          x: W * (0.08 + j / 12 * 0.84),
          y: H * (0.12 + Math.random() * 0.32),
          type: (j % 4 === 0) ? 'strobe' : pickType(),
          scale: 1.0 + Math.random() * 0.3,
          hue: nearHue(hue0 + j * 24, 16)
        });
      }
      nextFinale = 15 + Math.random() * 8;
    }
  }

  // ---------- 物理 ----------
  function step(dt) {
    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      r.life -= dt;
      if (Math.random() < 0.62) {
        pushP(P(r.x + (Math.random() - 0.5) * 2, r.y + 8,
          (Math.random() - 0.5) * 10, 22 + Math.random() * 22,
          40, 0.24 + Math.random() * 0.16, 2.6 + Math.random() * 1.8, 0.9, false, 24, 1.7));
      }
      if (r.y <= r.ty || r.vy >= -6 || r.life <= 0) {
        shell(r.type, r.x, r.y, r.hue, r.scale);
        rockets.splice(i, 1);
      }
    }

    for (var j = parts.length - 1; j >= 0; j--) {
      var p = parts[j];
      p.px = p.x; p.py = p.y;

      if (p.split > 0) {
        p.split -= dt;
        if (p.split <= 0) {
          for (var m = 0; m < 4; m++) {
            var a2 = Math.random() * 6.2832, v2 = 110 + Math.random() * 80;
            pushP(P(p.x, p.y, Math.cos(a2) * v2, Math.sin(a2) * v2,
              nearHue(p.h, 10), 1.0 + Math.random() * 0.4, 3.4 + Math.random() * 2.2, 1.2, true, 60, 1.3));
          }
        }
      }

      p.vy += p.g * dt;
      var dr = 1 - p.drag * dt;
      if (dr < 0) dr = 0;
      p.vx *= dr; p.vy *= dr;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0 || p.y > H + 90) parts.splice(j, 1);
    }

    for (var f = flashes.length - 1; f >= 0; f--) {
      flashes[f].life -= dt;
      if (flashes[f].life <= 0) flashes.splice(f, 1);
    }
  }

  // ---------- 渲染 ----------
  function render() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(2,4,10,0.115)';
    ctx.fillRect(0, 0, W, H);

    var hg = ctx.createLinearGradient(0, H * 0.60, 0, H);
    hg.addColorStop(0, 'rgba(22,30,60,0)');
    hg.addColorStop(1, 'rgba(40,52,96,0.09)');
    ctx.fillStyle = hg;
    ctx.fillRect(0, H * 0.60, W, H * 0.40);

    drawStars();
    drawCastle();

    ctx.globalCompositeOperation = 'lighter';

    for (var f = 0; f < flashes.length; f++) {
      var fl = flashes[f];
      var fa = fl.life / fl.l0;
      var rg = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, fl.r);
      rg.addColorStop(0, 'rgba(255,240,220,' + (0.11 * fa * fa).toFixed(3) + ')');
      rg.addColorStop(0.45, 'rgba(176,200,255,' + (0.04 * fa * fa).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(120,150,255,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, fl.r, 0, 6.2832);
      ctx.fill();
    }

    for (var i = 0; i < rockets.length; i++) {
      var r = rockets[i];
      ctx.strokeStyle = 'rgba(255,216,164,.8)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x - r.vx * 0.02, r.y - r.vy * 0.02);
      ctx.stroke();
      ctx.globalAlpha = 0.9;
      ctx.drawImage(sprite(42), r.x - 6, r.y - 6, 12, 12);
      ctx.globalAlpha = 1;
    }

    for (var j = 0; j < parts.length; j++) {
      var p = parts[j];
      var a = p.life / p.l0;
      if (a < 0) a = 0;
      var al = a * a;

      if (p.strobe) {
        if (Math.sin(clock * 24 + p.ph) < 0.05) continue;
        al = a;
      }

      if (p.trail && al > 0.05) {
        ctx.strokeStyle = 'hsla(' + Math.round(p.h) + ',100%,' + Math.round(70 + 11 * a) + '%,' + (0.42 * al).toFixed(3) + ')';
        ctx.lineWidth = p.w * (0.30 + 0.85 * a);
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }

      var size = p.size * (0.40 + 0.72 * a);
      ctx.globalAlpha = Math.min(1, 0.60 * al);
      ctx.drawImage(sprite(p.h), p.x - size / 2, p.y - size / 2, size, size);
      ctx.globalAlpha = 1;
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  function update(dt) {
    clock += dt;
    plan(dt);
    step(dt);
  }

  function tick(now) {
    raf = 0;
    if (!lastT) lastT = now;
    var dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now;
    if (!paused) {
      update(dt);
      render();
      raf = requestAnimationFrame(tick);
    }
  }

  function start() {
    if (!unlocked || paused || !ctx || raf) return;
    lastT = 0;
    raf = requestAnimationFrame(tick);
  }

  function stop() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  function setPaused(v) {
    paused = v;
    btnToggle.setAttribute('aria-pressed', String(v));
    btnToggle.textContent = v ? '让它继续' : '让烟花停下';
    if (v) stop(); else start();
  }

  function volley() {
    var hue = pickHue();
    pending.push({ t: 0.02, x: W * 0.30, y: H * 0.30, type: 'chrys', scale: 1.15, hue: hue });
    pending.push({ t: 0.34, x: W * 0.68, y: H * 0.24, type: 'double', scale: 1.05, hue: nearHue(hue + 140, 20) });
    pending.push({ t: 0.66, x: W * 0.50, y: H * 0.16, type: 'willow', scale: 1.2, hue: 42 });
    pending.push({ t: 1.00, x: W * 0.18, y: H * 0.22, type: 'ring', scale: 0.95, hue: nearHue(hue + 220, 20) });
    start();
  }

  btnAgain.addEventListener('click', volley);
  btnToggle.addEventListener('click', function () { setPaused(!paused); });

  canvas.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    launch(e.clientX, e.clientY, pickType(), 1.1);
    start();
  });

  document.addEventListener('keydown', function (e) {
    if (!unlocked) return;
    if (e.key !== ' ' && e.key !== 'Enter') return;
    var ae = document.activeElement;
    if (ae === btnAgain || ae === btnToggle) return;
    e.preventDefault();
    volley();
  });

  function staticScene() {
    paintSky();
    clock = 1.2;
    shell('double', W * 0.5, H * 0.34, 322, 1.1);
    for (var i = 0; i < 80; i++) step(0.016);
    drawStars();
    drawCastle();
    ctx.globalCompositeOperation = 'lighter';
    for (var j = 0; j < parts.length; j++) {
      var p = parts[j];
      var a = Math.max(0, p.life / p.l0);
      var size = p.size * (0.40 + 0.72 * a);
      if (p.trail) {
        ctx.strokeStyle = 'hsla(' + Math.round(p.h) + ',100%,72%,' + (0.34 * a * a).toFixed(3) + ')';
        ctx.lineWidth = p.w;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
      ctx.globalAlpha = Math.min(1, 0.5 * a * a);
      ctx.drawImage(sprite(p.h), p.x - size / 2, p.y - size / 2, size, size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  if (ctx) {
    castleEl = document.getElementById('castleImg');
    if (castleEl) {
      if (castleEl.complete && castleEl.naturalWidth) bakeCastle();
      else castleEl.addEventListener('load', bakeCastle);
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);

    if (reduceMQ.matches) {
      paused = true;
      btnToggle.setAttribute('aria-pressed', 'true');
      btnToggle.textContent = '让它继续';
      staticScene();
    }
  } else {
    fallback.style.display = 'block';
    canvas.style.display = 'none';
    btnAgain.disabled = true;
    btnToggle.disabled = true;
  }

  // 开锁
  function unlock() {
    if (unlocked) return;
    if (pwInput.value !== PASS) {
      pwTip.textContent = 'ACCESS DENIED · 密码不正确，请重试';
      pwInput.value = '';
      pwInput.focus();
      lock.classList.remove('shake');
      void lock.offsetWidth;
      lock.classList.add('shake');
      return;
    }
    unlocked = true;
    pwTip.textContent = '';
    lock.classList.add('is-open');
    window.setTimeout(function () {
      if (lock && lock.parentNode) lock.parentNode.removeChild(lock);
    }, 620);
    if (ctx) {
      volley();
      start();
    }
  }

  pwForm.addEventListener('submit', function (e) {
    e.preventDefault();
    unlock();
  });

  // 开屏：系统授权界面
  (function boot() {
    var el = document.getElementById('boot');
    if (!el || reduceMQ.matches) {
      if (el && el.parentNode) el.parentNode.removeChild(el);
      lockInner.style.opacity = '1';
      lockInner.style.transform = 'none';
      try { pwInput.focus(); } catch (err) {}
      return;
    }

    var grant = document.getElementById('bootGrant');
    var bar = document.getElementById('bootBar');
    var stepEl = document.getElementById('bootStep');
    var clockEl = document.getElementById('bootClock');
    var waitEl = document.getElementById('bootWait');
    var revealed = false, gone = false, ct = 0;

    function revealLock() {
      if (revealed) return;
      revealed = true;
      lockInner.style.opacity = '1';
      lockInner.style.transform = 'none';
      try { pwInput.focus(); } catch (err) {}
    }

    function dropBoot() {
      if (!el || !el.parentNode) return;
      el.parentNode.removeChild(el);
      el = null;
    }

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function tickClock() {
      var d = new Date();
      if (clockEl) clockEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    tickClock();
    ct = window.setInterval(tickClock, 1000);

    if (bar) window.setTimeout(function () { bar.style.width = '34%'; }, 160);

    function grantAccess() {
      if (gone) return;
      gone = true;
      window.clearInterval(ct);
      el.classList.add('is-granted');
      if (bar) bar.style.width = '100%';
      if (stepEl) stepEl.textContent = '06';
      if (waitEl) waitEl.innerHTML = '已授予访问权限<em>ACCESS GRANTED</em>';
      document.removeEventListener('keydown', onKey, true);
      window.setTimeout(function () {
        el.classList.add('is-out');
        revealLock();
      }, 380);
      window.setTimeout(dropBoot, 1050);
    }

    function onKey(e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        grantAccess();
      }
    }

    if (grant) grant.addEventListener('click', grantAccess);
    document.addEventListener('keydown', onKey, true);
  })();

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else if (unlocked && !paused) start();
  });
})();
</script>
</body>
</html>
